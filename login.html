{% extends "base_public.html" %}{% from "_macros.html" import csrf with context %}
{% block title %}Вход{% endblock %}
{% block content %}<div class="authbox"><div class="card"><h1>Вход</h1>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post">{{ csrf() }}
 <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus></div>
 <div class="field"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
 <button class="btn" style="width:100%" type="submit">Войти</button>
</form>
<p class="small mt"><a href="{{ url_for('auth.forgot') }}">Забыли пароль?</a> · <a href="{{ url_for('auth.register') }}">Создать аккаунт</a></p></div></div>{% endblock %}

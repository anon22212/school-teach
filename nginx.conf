server {
    listen 80;
    server_name example.ru;               # замените на свой домен, затем: certbot --nginx
    client_max_body_size 2m;
    limit_req_zone $binary_remote_addr zone=ta:10m rate=10r/s;

    location /static/ { alias /opt/teacherai/app/static/; expires 7d; }
    location / {
        limit_req zone=ta burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
